<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Niblit AIOS</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #0b0b0f;
      color: #eaeaea;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      text-align: center;
      padding: 40px;
    }
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2563eb, #0ea5a4);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #fff;
      margin-bottom: 20px;
    }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p  { color: #8892a4; font-size: 14px; margin: 0 0 24px; }
    a  {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    a:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">N</div>
    <h1>Niblit AIOS</h1>
    <p>Autonomous AI Operating System</p>
    <a href="/health">Check API Health</a>
  </div>
</body>
</html>
